<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GPS Art Walk</title>
  
  <!-- Leaflet CSS (하위 호환성 및 안정성이 검증된 버전) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <link rel="stylesheet" href="style.css?v=20261028_5">
</head>
<body>
  <!-- 1. 메인 지도 컨테이너 -->
  <div id="mapView"></div>

  <!-- 2. 상단 모드 선택 패널 -->
  <div class="top-panel" id="topPanel">
    <div class="panel-content">
      <span class="mode-label">현재 모드:</span>
      <select id="spinnerMode" class="mode-select">
        <option value="FREE_DRAW">자유 그리기</option>
        <option value="FOLLOW_ROUTE">경로 따라가기</option>
        <option value="AUTO_SHAPE">자동 모양 만들기</option>
      </select>
    </div>
  </div>

  <!-- 3. 현재 생성된 모양 표시 뱃지 및 도안 맞춰보기 버튼 -->
  <div class="shape-info-bar" id="shapeInfoBar" style="display: none;">
    <div id="tvCurrentShape" class="shape-badge">모양: 강아지</div>
    <button id="btnToggleCompare" class="btn-compare">🔍 도안 맞춰보기</button>
  </div>

  <!-- 3-1. 도안 겹쳐보기(맞춤 검증) 컨트롤 바 -->
  <div id="compareBar" class="compare-bar" style="display: none;">
    <div class="compare-tabs">
      <button class="compare-tab" data-view="road">실제 도로만</button>
      <button class="compare-tab active" data-view="both">1:1 겹쳐보기</button>
      <button class="compare-tab" data-view="origin">원본 도안만</button>
    </div>
    <div class="compare-slider-row">
      <span class="compare-label">도안 투명도:</span>
      <input type="range" id="compareOpacitySlider" min="10" max="90" value="40" class="compare-slider">
      <span id="compareOpacityVal" class="compare-val">40%</span>
    </div>
  </div>

  <!-- 4. 내 위치 찾기 버튼 -->
  <button id="btnMyLocation" class="btn-3d btn-my-location" title="내 위치">
    <svg class="location-icon" viewBox="0 0 24 24" width="20" height="20">
      <path fill="currentColor" d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
    </svg>
    <span>내 위치</span>
  </button>

  <!-- 5. 하단 컨트롤 패널 -->
  <div class="bottom-panel" id="bottomPanel">
    <div id="tvStatus" class="status-text">준비 완료</div>
    <div id="tvCoords" class="coords-text">위도: - , 경도: -</div>
    
    <div class="button-group">
      <button id="btnStart" class="btn-3d btn-start">시작</button>
      <button id="btnStop" class="btn-3d btn-stop" disabled>종료</button>
      <button id="btnClear" class="btn-3d btn-clear">초기화</button>
    </div>
  </div>

  <!-- 6. 자동 모양 만들기 모달 다이얼로그 -->
  <div id="autoShapeModal" class="modal-overlay" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">모양 및 최대 크기 설정</div>
      <div class="modal-body">
        <label for="shapeSelect" class="modal-label">모양 선택</label>
        <select id="shapeSelect" class="modal-select">
          <option value="0">강아지 (기본 2.0km)</option>
          <option value="1">고양이 (기본 1.5km)</option>
          <option value="2">공룡 (기본 3.0km)</option>
          <option value="3">새 (기본 2.5km)</option>
          <option value="4">하트 (기본 1.5km)</option>
          <option value="5">별 (기본 2.0km)</option>
          <option value="6">자동차 (기본 2.0km)</option>
          <option value="7">물고기 (기본 1.5km)</option>
          <option value="8">집 (기본 1.5km)</option>
          <option value="9">왕관 (기본 2.0km)</option>
        </select>

        <div id="tvDistance" class="distance-label">최대 허용 길이: 5.0 km</div>
        <input type="range" id="seekBar" class="distance-slider" min="5" max="100" value="50" step="1">
      </div>
      <div class="modal-footer">
        <button id="btnShapeCancel" class="btn-modal btn-cancel">취소</button>
        <button id="btnShapeConfirm" class="btn-modal btn-confirm">지도에 띄우기</button>
      </div>
    </div>
  </div>

  <!-- 7. 공통 알림 모달 -->
  <div id="alertModal" class="modal-overlay" style="display: none;">
    <div class="modal-dialog">
      <div class="modal-header">알림</div>
      <div id="alertModalMessage" class="modal-body modal-message"></div>
      <div class="modal-footer">
        <button id="btnAlertClose" class="btn-modal btn-confirm">확인</button>
      </div>
    </div>
  </div>

  <!-- Leaflet JS (하위 호환성 우수) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js?v=20261028_5"></script>
</body>
</html>
